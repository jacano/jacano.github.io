<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" role="img" aria-labelledby="title desc">
  <title id="title">Where a C# binding copies its data</title>
  <desc id="desc">A typical binding copies the payload twice: once into an unmanaged staging buffer and once into the structure of the native API, so it moves twice the bytes. A binding that uses Span, Memory and fixed pointers copies once and lets the native API read the pinned memory. Below the two lanes, three cards list the choices that stay: the door (P/Invoke, C++/CLI or DNNE with NativeAOT), who frees the memory (the native side allocates, C# disposes with IDisposable and SafeHandle) and the package per runtime (win-x64, linux-x64, osx-arm64, tested in CI).</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern>
    <marker id="arrow-red" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#fb7185"/></marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 10 4 0 8Z" fill="#34d399"/></marker>
  </defs>
  <rect width="1100" height="600" fill="#020617"/>
  <rect width="1100" height="600" fill="url(#grid)"/>
  <text x="40" y="44" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Two copies or one: where a C# binding spends its time</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">The managed boundary of Box2DCS, ManagedCrunch and ManagedXZLZMA &#183; the payload is the cost</text>

  <rect x="36" y="94" width="1028" height="152" rx="14" fill="#1b1014" stroke="#fb7185" stroke-opacity=".35"/>
  <text x="56" y="120" fill="#fda4af" font-family="system-ui,sans-serif" font-size="11" font-weight="700">TYPICAL BINDING &#183; TWO COPIES OF THE SAME DATA</text>

  <rect x="56" y="136" width="190" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/>
  <text x="76" y="166" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="16" font-weight="700">C# array</text>
  <text x="76" y="190" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11">byte[] &#183; Memory&lt;T&gt;</text>

  <line x1="246" y1="178" x2="314" y2="178" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="280" y="166" text-anchor="middle" fill="#fda4af" font-family="system-ui,sans-serif" font-size="11" font-weight="700">copy 1</text>

  <rect x="316" y="136" width="230" height="84" rx="10" fill="#0f172a" stroke="#a78bfa" stroke-opacity=".5"/>
  <text x="336" y="166" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Unmanaged buffer</text>
  <text x="336" y="190" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">the marshaller stages it</text>

  <line x1="546" y1="178" x2="614" y2="178" stroke="#fb7185" stroke-width="2" marker-end="url(#arrow-red)"/>
  <text x="580" y="166" text-anchor="middle" fill="#fda4af" font-family="system-ui,sans-serif" font-size="11" font-weight="700">copy 2</text>

  <rect x="616" y="136" width="250" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-opacity=".5"/>
  <text x="636" y="166" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Native API</text>
  <text x="636" y="190" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">copies into its own structure</text>

  <rect x="894" y="140" width="150" height="76" rx="10" fill="#2b1724" stroke="#fb7185" stroke-opacity=".55"/>
  <text x="969" y="166" text-anchor="middle" fill="#fda4af" font-family="system-ui,sans-serif" font-size="10" font-weight="700">COST</text>
  <text x="969" y="192" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="17" font-weight="700">2&#215; bytes</text>

  <rect x="36" y="262" width="1028" height="152" rx="14" fill="#0d1b19" stroke="#34d399" stroke-opacity=".35"/>
  <text x="56" y="288" fill="#86efac" font-family="system-ui,sans-serif" font-size="11" font-weight="700">THIS BINDING &#183; ONE COPY, THEN A PINNED POINTER</text>

  <rect x="56" y="304" width="210" height="84" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-opacity=".5"/>
  <text x="76" y="334" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="16" font-weight="700">C# Span&lt;T&gt;</text>
  <text x="76" y="358" fill="#94a3b8" font-family="ui-monospace,monospace" font-size="11">fixed &#183; Memory&lt;T&gt;</text>

  <line x1="266" y1="346" x2="614" y2="346" stroke="#34d399" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="440" y="334" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="11" font-weight="700">copy 1, and only one</text>

  <rect x="616" y="304" width="250" height="84" rx="10" fill="#0f172a" stroke="#34d399" stroke-opacity=".5"/>
  <text x="636" y="334" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Native API</text>
  <text x="636" y="358" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">reads the pinned memory</text>

  <rect x="894" y="308" width="150" height="76" rx="10" fill="#102a22" stroke="#34d399" stroke-opacity=".55"/>
  <text x="969" y="334" text-anchor="middle" fill="#86efac" font-family="system-ui,sans-serif" font-size="10" font-weight="700">COST</text>
  <text x="969" y="360" text-anchor="middle" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="17" font-weight="700">1&#215; bytes</text>

  <rect x="36" y="430" width="330" height="128" rx="12" fill="#0f172a" fill-opacity=".75" stroke="#475569"/>
  <text x="56" y="458" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11" font-weight="700">WHICH DOOR</text>
  <text x="56" y="486" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">P/Invoke &#183; flat C, portable</text>
  <text x="56" y="508" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">C++/CLI &#183; complex C++, Windows only</text>
  <text x="56" y="530" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">DNNE &#183; NativeAOT, .NET 7 and later</text>

  <rect x="385" y="430" width="330" height="128" rx="12" fill="#0f172a" fill-opacity=".75" stroke="#475569"/>
  <text x="405" y="458" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11" font-weight="700">WHO FREES</text>
  <text x="405" y="486" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">The native side allocates</text>
  <text x="405" y="508" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">C# disposes: IDisposable</text>
  <text x="405" y="530" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">and SafeHandle</text>

  <rect x="734" y="430" width="330" height="128" rx="12" fill="#0f172a" fill-opacity=".75" stroke="#475569"/>
  <text x="754" y="458" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="11" font-weight="700">WHICH RUNTIME</text>
  <text x="754" y="486" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">One package per RID</text>
  <text x="754" y="508" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">win-x64 &#183; linux-x64 &#183; osx-arm64</text>
  <text x="754" y="530" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="12">tested in CI, not on my machine</text>

  <text x="40" y="586" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">The native API picks the method; the copies decide the speed. Diagram is conceptual, not to scale.</text>
</svg>

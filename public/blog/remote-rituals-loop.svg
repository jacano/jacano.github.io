<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Four habits that replace the office</title>
  <desc id="desc">A weekly demo shows the work. The team draws the architecture and keeps the diagrams in the repository, next to the code. On-call runs with blameless postmortems that ask what failed, not who failed. The team tracks how long a critical fix takes to reach production and protects that number, because a team that fears a bad number hides it. The four habits feed each other every week, and the interesting work stays with the team.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern>
    <marker id="arrow-slate" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 9 3.5 0 7Z" fill="#64748b"/></marker>
    <marker id="arrow-back" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0 0 9 3.5 0 7Z" fill="#38bdf8"/></marker>
  </defs>
  <rect width="1100" height="480" fill="#020617"/>
  <rect width="1100" height="480" fill="url(#grid)"/>
  <text x="40" y="44" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="21" font-weight="700">Four habits that replace the office</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">What a distributed team sees and decides with &#183; the loop is the week</text>

  <rect x="36" y="116" width="230" height="154" rx="12" fill="#0f172a" fill-opacity=".8" stroke="#38bdf8" stroke-opacity=".45"/>
  <text x="56" y="148" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="10" font-weight="700">MONDAY</text>
  <text x="56" y="176" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Weekly demo</text>
  <text x="56" y="204" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">Show the work.</text>
  <text x="56" y="226" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">A demo tells more</text>
  <text x="56" y="246" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">than a status update.</text>

  <line x1="266" y1="193" x2="296" y2="193" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <rect x="300" y="116" width="230" height="154" rx="12" fill="#0f172a" fill-opacity=".8" stroke="#a78bfa" stroke-opacity=".45"/>
  <text x="320" y="148" fill="#a78bfa" font-family="system-ui,sans-serif" font-size="10" font-weight="700">ANY DAY</text>
  <text x="320" y="176" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Architecture</text>
  <text x="320" y="204" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">The team draws it.</text>
  <text x="320" y="226" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">The diagram lives in</text>
  <text x="320" y="246" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">the repo, with the code.</text>

  <line x1="530" y1="193" x2="560" y2="193" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <rect x="564" y="116" width="230" height="154" rx="12" fill="#0f172a" fill-opacity=".8" stroke="#34d399" stroke-opacity=".45"/>
  <text x="584" y="148" fill="#34d399" font-family="system-ui,sans-serif" font-size="10" font-weight="700">WHEN IT BREAKS</text>
  <text x="584" y="176" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="17" font-weight="700">On-call</text>
  <text x="584" y="204" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">Blameless postmortem.</text>
  <text x="584" y="226" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">Ask what failed,</text>
  <text x="584" y="246" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">not who failed.</text>

  <line x1="794" y1="193" x2="824" y2="193" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow-slate)"/>

  <rect x="828" y="116" width="230" height="154" rx="12" fill="#0f172a" fill-opacity=".8" stroke="#fbbf24" stroke-opacity=".45"/>
  <text x="848" y="148" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="10" font-weight="700">EVERY WEEK</text>
  <text x="848" y="176" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Fix to production</text>
  <text x="848" y="204" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">How long a critical fix</text>
  <text x="848" y="226" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">takes. Watch the trend,</text>
  <text x="848" y="246" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">then protect the number.</text>

  <path d="M943 270V318H151V274" fill="none" stroke="#38bdf8" stroke-width="1.6" marker-end="url(#arrow-back)"/>
  <text x="547" y="302" text-anchor="middle" fill="#7dd3fc" font-family="system-ui,sans-serif" font-size="11" font-weight="700">the next week, with the number in hand</text>

  <rect x="36" y="352" width="1028" height="82" rx="12" fill="#1a1610" stroke="#fbbf24" stroke-opacity=".4"/>
  <text x="56" y="382" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="11" font-weight="700">THE INTERESTING WORK BELONGS TO THE TEAM</text>
  <text x="56" y="408" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">The hard bug, the new tool and the design nobody has solved. My job is to remove blockers and hand over context.</text>

  <text x="40" y="464" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">A team that fears a bad number hides it, and a hidden number is worse than a bad one.</text>
</svg>

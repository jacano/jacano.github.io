  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 660" role="img" aria-labelledby="title desc">
    <title id="title">Command Code against OpenCode Go, head to head in the last of four rounds</title>
    <desc id="desc">Five measurements of the last round, 48 requests a side, on 23 September 2026, both routes serving deepseek-v4.1-flash, measured from Seville in Spain. Command Code against OpenCode Go: the time to the first byte of the server on a ready connection, 27 against 297 milliseconds. The time to the first token of a short answer, 754 against 1822 milliseconds. The total time of a long answer of 500 visible tokens, 2839 against 4006 milliseconds. The writing speed of the visible content, 446 against 292 tokens per second. Four requests at once, 902 against 424 tokens per second. Command Code is faster on all five measurements, and the same direction held in all four rounds of that day.</desc>
    <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern></defs>
    <rect width="1100" height="660" fill="#020617"/><rect width="1100" height="660" fill="url(#grid)"/>
    <text x="40" y="54" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="30" font-weight="700">Head to head: Command Code against OpenCode Go</text>
    <text x="40" y="86" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="16">the last of four rounds, 48 requests a side, 23 September 2026 &#183; measured from Seville, Spain</text>
    <rect x="40" y="104" width="1020" height="406" rx="14" fill="#0f172a" fill-opacity=".7" stroke="#1e293b"/>
    <text x="64" y="140" fill="#64748b" font-family="system-ui,sans-serif" font-size="12">MEASUREMENT</text>
    <text x="780" y="140" fill="#34d399" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="end">COMMAND CODE</text>
    <text x="970" y="140" fill="#fda4af" font-family="system-ui,sans-serif" font-size="13" font-weight="700" text-anchor="end">OPENCODE GO</text>
    <line x1="64" y1="152" x2="1036" y2="152" stroke="#1e293b"/><line x1="560" y1="152" x2="560" y2="510" stroke="#1e293b"/>
    <text x="64" y="182" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16.5">Time to the first byte</text>
    <text x="64" y="202" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12.5">a ready connection</text>
    <text x="680" y="191" fill="#34d399" font-family="system-ui,sans-serif" font-size="17" text-anchor="end">&#10003;</text>
    <text x="780" y="192" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="21" font-weight="700" text-anchor="end">27</text>
    <text x="790" y="192" fill="#34d399" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="15">ms</text>
    <text x="970" y="192" fill="#fda4af" font-family="ui-monospace,Menlo,monospace" font-size="19" text-anchor="end">297</text>
    <text x="980" y="192" fill="#fda4af" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="13.5">ms</text>
    <line x1="64" y1="223" x2="1036" y2="223" stroke="#1e293b"/>
    <text x="64" y="253" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16.5">Time to the first token</text>
    <text x="64" y="273" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12.5">a short answer</text>
    <text x="680" y="262" fill="#34d399" font-family="system-ui,sans-serif" font-size="17" text-anchor="end">&#10003;</text>
    <text x="780" y="263" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="21" font-weight="700" text-anchor="end">754</text>
    <text x="790" y="263" fill="#34d399" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="15">ms</text>
    <text x="970" y="263" fill="#fda4af" font-family="ui-monospace,Menlo,monospace" font-size="19" text-anchor="end">1822</text>
    <text x="980" y="263" fill="#fda4af" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="13.5">ms</text>
    <line x1="64" y1="294" x2="1036" y2="294" stroke="#1e293b"/>
    <text x="64" y="324" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16.5">Total time of a long answer</text>
    <text x="64" y="344" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12.5">500 visible tokens</text>
    <text x="680" y="333" fill="#34d399" font-family="system-ui,sans-serif" font-size="17" text-anchor="end">&#10003;</text>
    <text x="780" y="334" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="21" font-weight="700" text-anchor="end">2839</text>
    <text x="790" y="334" fill="#34d399" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="15">ms</text>
    <text x="970" y="334" fill="#fda4af" font-family="ui-monospace,Menlo,monospace" font-size="19" text-anchor="end">4006</text>
    <text x="980" y="334" fill="#fda4af" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="13.5">ms</text>
    <line x1="64" y1="365" x2="1036" y2="365" stroke="#1e293b"/>
    <text x="64" y="395" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16.5">Writing speed</text>
    <text x="64" y="415" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12.5">visible content</text>
    <text x="680" y="404" fill="#34d399" font-family="system-ui,sans-serif" font-size="17" text-anchor="end">&#10003;</text>
    <text x="780" y="405" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="21" font-weight="700" text-anchor="end">446</text>
    <text x="790" y="405" fill="#34d399" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="15">tok/s</text>
    <text x="970" y="405" fill="#fda4af" font-family="ui-monospace,Menlo,monospace" font-size="19" text-anchor="end">292</text>
    <text x="980" y="405" fill="#fda4af" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="13.5">tok/s</text>
    <line x1="64" y1="436" x2="1036" y2="436" stroke="#1e293b"/>
    <text x="64" y="466" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="16.5">Four requests at once</text>
    <text x="64" y="486" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12.5">aggregate throughput</text>
    <text x="680" y="475" fill="#34d399" font-family="system-ui,sans-serif" font-size="17" text-anchor="end">&#10003;</text>
    <text x="780" y="476" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="21" font-weight="700" text-anchor="end">902</text>
    <text x="790" y="476" fill="#34d399" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="15">tok/s</text>
    <text x="970" y="476" fill="#fda4af" font-family="ui-monospace,Menlo,monospace" font-size="19" text-anchor="end">424</text>
    <text x="980" y="476" fill="#fda4af" fill-opacity=".72" font-family="ui-monospace,Menlo,monospace" font-size="13.5">tok/s</text>
    <line x1="64" y1="507" x2="1036" y2="507" stroke="#1e293b"/>
    <rect x="40" y="530" width="1020" height="80" rx="14" fill="#064e3b" fill-opacity=".45" stroke="#34d399" stroke-opacity=".5"/>
    <text x="64" y="566" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="24" font-weight="700">Command Code is faster on all five measurements</text>
    <text x="64" y="594" fill="#a7f3d0" font-family="system-ui,sans-serif" font-size="16">The same direction held in all four rounds, 15:34Z to 21:23Z on 23 September 2026</text>
    <text x="40" y="634" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="14">Run it yourself: python bench.py ab --a commandcode --b opencode-go --n 4</text>
    <text x="1060" y="634" fill="#64748b" font-family="system-ui,sans-serif" font-size="13.5" text-anchor="end">the ticked value is the faster of the two</text>
  </svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">One week of the 2.0TD tariff</title>
  <desc id="desc">The grid fee of the 2.0TD tariff changes by hour. From Monday to Friday, P1 peak runs from 10:00 to 14:00 and from 18:00 to 22:00, P2 flat covers 08:00 to 10:00, 14:00 to 18:00 and 22:00 to 24:00, and P3 off-peak covers 00:00 to 08:00. Saturday and Sunday are off-peak all day, and a national holiday follows Sunday. The bill is a mix of the three periods.</desc>
  <rect width="1100" height="390" fill="#020617"/>
  <text x="40" y="44" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="21" font-weight="700">One week of the 2.0TD tariff</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">The grid fee changes by hour &#183; your bill is a mix of the three periods</text>
  <rect x="111" y="111" width="938" height="184" rx="4" fill="none" stroke="#1e293b"/>

  <circle cx="255" cy="361.1" r="4.4" fill="#020617" stroke="#34d399" stroke-width="2.4"/>
  <circle cx="507" cy="355.5" r="4.4" fill="#020617" stroke="#34d399" stroke-width="2.4"/>
  <circle cx="758" cy="358.9" r="4.4" fill="#020617" stroke="#34d399" stroke-width="2.4"/>
  <circle cx="1010" cy="364.4" r="4.4" fill="#020617" stroke="#34d399" stroke-width="2.4"/>
  <polyline points="255,359.3 507,361.9 758,357.7 1010,365.7" fill="none" stroke="#a78bfa" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="8 4"/>
  <circle cx="255" cy="359.3" r="4.4" fill="#020617" stroke="#a78bfa" stroke-width="2.4"/>
  <circle cx="507" cy="361.9" r="4.4" fill="#020617" stroke="#a78bfa" stroke-width="2.4"/>
  <circle cx="758" cy="357.7" r="4.4" fill="#020617" stroke="#a78bfa" stroke-width="2.4"/>
  <circle cx="1010" cy="365.7" r="4.4" fill="#020617" stroke="#a78bfa" stroke-width="2.4"/>
  <text x="150" y="258" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="14">the first byte swings between 9.1 and 20.6 times; the other four stay between 1.4 and 2.4</text>
  <line x1="34.0" y1="481.0" x2="56.0" y2="481.0" stroke="#22d3ee" stroke-width="2.6" stroke-linecap="round"/>
  <text x="58" y="486" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13.5">Time to the first byte</text>
  <text x="254.655" y="486" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">9.1 to 20.6×</text>
  <line x1="379.9" y1="481.0" x2="401.9" y2="481.0" stroke="#f472b6" stroke-width="2.6" stroke-linecap="round"/>
  <text x="403.905" y="486" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13.5">Time to the first token</text>
  <text x="608.8625" y="486" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">1.7 to 2.4×</text>
  <line x1="34.0" y1="507.0" x2="56.0" y2="507.0" stroke="#fbbf24" stroke-width="2.6" stroke-linecap="round"/>
  <text x="58" y="512" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13.5">Total time of a long answer</text>
  <text x="296.1675" y="512" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">1.4 to 1.9×</text>
  <line x1="413.7" y1="507.0" x2="435.7" y2="507.0" stroke="#34d399" stroke-width="2.6" stroke-linecap="round"/>
  <text x="437.73" y="512" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13.5">Writing speed</text>
  <text x="559.6625" y="512" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">1.5 to 1.7×</text>
  <line x1="677.2" y1="507.0" x2="699.2" y2="507.0" stroke="#a78bfa" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="8 4"/>
  <text x="701.225" y="512" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="13.5">Four requests at once</text>
  <text x="889.5775" y="512" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">1.5 to 1.7×</text>

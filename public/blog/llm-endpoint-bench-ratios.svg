<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 566" role="img" aria-labelledby="t d">
  <title id="t">How many times faster Command Code was than OpenCode Go, in four windows of one day</title>
  <desc id="d">Every value is how many times faster Command Code was on that measurement, so a bigger number is always a bigger gain for Command Code, and a line below the dashed line at 1 times would mean Command Code was the slower one. In the window at 15:34Z the first byte of the server came 11.8 times sooner, the first token of a short answer 1.7 times sooner, the whole long answer 1.9 times faster, the writing speed 1.6 times higher and four parallel requests 1.6 times faster. In the last window, at 21:23Z, the same five measurements were 11.0, 2.4, 1.4, 1.5 and 1.5 times. Across the four windows the first byte swings between 9.1 and 20.6 times while the four other measurements stay between 1.4 and 2.4 times.</desc>
  <defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern></defs>
  <rect width="1100" height="566" fill="#020617"/><rect width="1100" height="566" fill="url(#g)"/>
  <text x="40" y="52" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="27" font-weight="700">How many times faster Command Code was than OpenCode Go</text>
  <text x="40" y="82" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="16.5">four windows of one day &#183; a bigger number is a bigger gain for Command Code &#183; 48 requests a side</text>
  <line x1="150" y1="148.7" x2="1010" y2="148.7" stroke="#1e293b" stroke-width="0.8"/>
  <text x="140" y="153.7" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" text-anchor="end">20×</text>
  <line x1="150" y1="206.9" x2="1010" y2="206.9" stroke="#1e293b" stroke-width="0.8"/>
  <text x="140" y="211.9" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" text-anchor="end">10×</text>
  <line x1="150" y1="265.0" x2="1010" y2="265.0" stroke="#1e293b" stroke-width="0.8"/>
  <text x="140" y="270.0" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" text-anchor="end">5×</text>
  <line x1="150" y1="341.9" x2="1010" y2="341.9" stroke="#1e293b" stroke-width="0.8"/>
  <text x="140" y="346.9" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" text-anchor="end">2×</text>
  <line x1="150" y1="400.0" x2="1010" y2="400.0" stroke="#1e293b" stroke-width="1.4"/>
  <text x="140" y="405.0" fill="#64748b" font-family="system-ui,sans-serif" font-size="13" text-anchor="end">1×</text>
  <text x="150" y="118" fill="#64748b" font-family="system-ui,sans-serif" font-size="13">times faster, on a log scale</text>
  <rect x="150" y="400" width="860" height="30" fill="#7f1d1d" fill-opacity=".28"/>
  <line x1="150" y1="400" x2="1010" y2="400" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="1005" y="421" fill="#fca5a5" font-family="system-ui,sans-serif" font-size="12.5" text-anchor="end">below this line Command Code would be the slower one</text>
  <polyline points="255,193.2 507,214.7 758,146.3 1010,199.2" fill="none" stroke="#22d3ee" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="255" cy="193.2" r="4.4" fill="#020617" stroke="#22d3ee" stroke-width="2.4"/>
  <circle cx="507" cy="214.7" r="4.4" fill="#020617" stroke="#22d3ee" stroke-width="2.4"/>
  <circle cx="758" cy="146.3" r="4.4" fill="#020617" stroke="#22d3ee" stroke-width="2.4"/>
  <circle cx="1010" cy="199.2" r="4.4" fill="#020617" stroke="#22d3ee" stroke-width="2.4"/>
  <text x="255" y="178.2" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">11.8×</text>
  <text x="507" y="199.7" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">9.1×</text>
  <text x="758" y="131.3" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">20.6×</text>
  <text x="1010" y="184.2" fill="#22d3ee" font-family="system-ui,sans-serif" font-size="14.5" font-weight="700" text-anchor="middle">11.0×</text>

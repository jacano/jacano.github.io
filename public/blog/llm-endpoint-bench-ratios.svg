  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
    <title id="title">OpenCode Go divided by Command Code, four windows on one host</title>
    <desc id="desc">A ratio above the line at 1 is a delay where OpenCode Go waits longer than Command Code. A ratio below the line is a rate where OpenCode Go is slower. The delays move between the windows and stay above the line: the first byte of the server 11.77, 9.11, 20.58 and 10.95; the first token of a short answer 1.75, 2.20, 2.16 and 2.42; the total time of a long answer 1.94, 1.66, 1.86 and 1.41. The rates stay near 0.6 in every window: the visible content of a long answer 0.63, 0.59, 0.61 and 0.65; one request under four parallel requests 0.62, 0.63, 0.60 and 0.66.</desc>
    <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern></defs>
    <rect width="1100" height="560" fill="#020617"/>
    <rect width="1100" height="560" fill="url(#grid)"/>
    <text x="40" y="46" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="21" font-weight="700">OpenCode Go divided by Command Code, four windows on one host</text>
    <text x="40" y="72" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">Above 1 is a delay where OpenCode Go waits longer &#183; below 1, a rate where it is slower &#183; one Windows 11 host, 23 September 2026</text>

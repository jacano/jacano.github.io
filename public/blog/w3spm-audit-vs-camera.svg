<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="title desc">
  <title id="title">An audit is a photo, posture management is the camera</title>
  <desc id="desc">An audit, a formal verification or a key-management review describes the system at one moment, near the code. After that moment the system keeps moving: signers change, timelocks move, oracles rotate and permissions drift. Web3 posture management watches the whole path instead: it discovers the assets from the code to the chain, looks for risk on its own, watches production and plugs into CI/CD. In H1 2026 more than 75 percent of losses came from operational and configuration gaps, and the average time from exploit to irreversible loss was 12 minutes, which is too short to read an alert, investigate it and react.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern>
  </defs>
  <rect width="1100" height="580" fill="#020617"/>
  <rect width="1100" height="580" fill="url(#grid)"/>
  <text x="40" y="44" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="21" font-weight="700">An audit is a photo. Posture management is the camera.</text>
  <text x="40" y="70" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">The system keeps moving after the review &#183; signers, timelocks, oracles, permissions</text>

  <line x1="60" y1="136" x2="1040" y2="136" stroke="#334155" stroke-width="1.2"/>
  <g font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#64748b" text-anchor="middle">
    <text x="170" y="120">CODE</text>
    <text x="450" y="120">CI/CD</text>
    <text x="730" y="120">DEPLOY</text>
    <text x="1010" y="120">LIVE CHAIN</text>
  </g>
  <g stroke="#475569" stroke-width="1.2">
    <line x1="170" y1="132" x2="170" y2="144"/>
    <line x1="450" y1="132" x2="450" y2="144"/>
    <line x1="730" y1="132" x2="730" y2="144"/>
    <line x1="1010" y1="132" x2="1010" y2="144"/>
  </g>

  <text x="40" y="182" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="11" font-weight="700">AN AUDIT</text>
  <circle cx="170" cy="212" r="15" fill="#2b2117" stroke="#fbbf24" stroke-width="1.6"/>
  <g stroke="#fbbf24" stroke-width="1.6">
    <line x1="170" y1="188" x2="170" y2="196"/>
    <line x1="170" y1="228" x2="170" y2="236"/>
    <line x1="146" y1="212" x2="154" y2="212"/>
    <line x1="186" y1="212" x2="194" y2="212"/>
    <line x1="153" y1="195" x2="158" y2="200"/>
    <line x1="182" y1="224" x2="187" y2="229"/>
    <line x1="187" y1="195" x2="182" y2="200"/>
    <line x1="158" y1="224" x2="153" y2="229"/>
  </g>
  <text x="170" y="258" text-anchor="middle" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="11">one review, one moment</text>

  <line x1="205" y1="212" x2="1040" y2="212" stroke="#64748b" stroke-width="1.4" stroke-dasharray="7 6"/>
  <text x="216" y="200" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">After the check the system keeps moving:</text>
  <text x="216" y="234" fill="#64748b" font-family="system-ui,sans-serif" font-size="12">signers change &#183; timelocks move &#183; oracles rotate &#183; permissions drift</text>

  <text x="40" y="306" fill="#86efac" font-family="system-ui,sans-serif" font-size="11" font-weight="700">W3SPM</text>
  <text x="96" y="306" fill="#64748b" font-family="system-ui,sans-serif" font-size="11">a current picture of the assets and the policy, not one from last quarter</text>

  <rect x="60" y="322" width="980" height="88" rx="14" fill="#0d1b19" stroke="#34d399" stroke-opacity=".45"/>
  <rect x="76" y="338" width="270" height="56" rx="9" fill="#102a22" stroke="#34d399" stroke-opacity=".45"/>
  <text x="94" y="362" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="13" font-weight="600">discovers the assets</text>
  <text x="94" y="382" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">from the code to the chain</text>

  <rect x="396" y="338" width="270" height="56" rx="9" fill="#102a22" stroke="#34d399" stroke-opacity=".45"/>
  <text x="414" y="362" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="13" font-weight="600">looks for risk</text>
  <text x="414" y="382" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">on its own, not when asked</text>

  <rect x="716" y="338" width="270" height="56" rx="9" fill="#102a22" stroke="#34d399" stroke-opacity=".45"/>
  <text x="734" y="362" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="13" font-weight="600">watches production</text>
  <text x="734" y="382" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">and plugs into CI/CD</text>

  <rect x="36" y="428" width="500" height="96" rx="12" fill="#1b1014" stroke="#fb7185" stroke-opacity=".4"/>
  <text x="58" y="466" fill="#fda4af" font-family="system-ui,sans-serif" font-size="26" font-weight="700">75%+</text>
  <text x="58" y="490" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">of the losses of 2026 came from operations and configuration,</text>
  <text x="58" y="510" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">not from the smart contracts themselves.</text>

  <rect x="564" y="428" width="500" height="96" rx="12" fill="#1a1610" stroke="#fbbf24" stroke-opacity=".4"/>
  <text x="586" y="466" fill="#fcd34d" font-family="system-ui,sans-serif" font-size="26" font-weight="700">12 min</text>
  <text x="586" y="490" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12">from exploit to irreversible loss, on average: not enough</text>
  <text x="586" y="510" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">time to read an alert, investigate it and react.</text>

  <text x="40" y="564" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">Source: The State of Digital Asset Security, H1 2026, as cited in the post. Detection has to happen before production.</text>
</svg>

  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 648" role="img" aria-labelledby="title desc">
    <title id="title">Command Code and OpenCode Go: the same model, the same price, four campaigns</title>
    <desc id="desc">Both plans cost 10 dollars a month and both served deepseek-v4.1-flash on 23 September 2026, measured from Seville, Spain. In the last campaign the first byte of the server on a ready connection arrived in 27 milliseconds on Command Code and 297 on OpenCode Go; the first token of a short answer in 754 and 1822 milliseconds; the visible content of a long answer at 446 and 292 tokens per second; four parallel requests at 902 and 424 tokens per second in total. Command Code was faster on every measurement in all four campaigns.</desc>
    <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern><linearGradient id="verdict" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#064e3b" stop-opacity=".55"/><stop offset="1" stop-color="#0f172a" stop-opacity=".2"/></linearGradient></defs>
    <rect width="1100" height="648" fill="#020617"/>
    <rect width="1100" height="648" fill="url(#grid)"/>
    <text x="40" y="50" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="25" font-weight="700">The same model, the same price, four campaigns</text>
    <text x="40" y="78" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13.5">deepseek-v4.1-flash on two routes &#183; one Windows 11 host from Seville, Spain &#183; 23 September 2026</text>
    <text x="40" y="98" fill="#64748b" font-family="system-ui,sans-serif" font-size="12.5">Latency depends on where you sit. Run the benchmark on your own machine and compare.</text>
    <rect x="40" y="118" width="500" height="88" rx="14" fill="#0f172a" fill-opacity=".8" stroke="#fb7185" stroke-opacity=".55"/>
    <text x="64" y="150" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="17" font-weight="700">OpenCode Go</text>
    <text x="64" y="174" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">$10 a month, first month $5 &#183; about $60 of usage</text>
    <text x="64" y="194" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="11.5">opencode.ai/docs/go &#183; needs the header x-opencode-session</text>
    <rect x="560" y="118" width="500" height="88" rx="14" fill="#0f172a" fill-opacity=".8" stroke="#34d399" stroke-opacity=".55"/>
    <text x="584" y="150" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Command Code &#8212; the GOAT plan</text>
    <text x="584" y="174" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">$10 a month &#183; $70 of credits, a 7x multiplier</text>
    <text x="584" y="194" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="11.5">commandcode.ai/docs/plans/goat &#183; no extra header</text>
    <text x="40" y="244" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="14" font-weight="700">One campaign, 48 requests a side, the two routes measured one after the other</text>
    <rect x="40" y="260" width="240" height="206" rx="14" fill="#0f172a" fill-opacity=".7" stroke="#1e293b"/>
    <text x="58" y="288" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Time to the first byte</text>
    <text x="58" y="306" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">the server, ready connection</text>
    <text x="58" y="330" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Command Code</text>
    <rect x="58" y="336" width="11" height="13" rx="6.5" fill="#34d399" fill-opacity=".85"/>
    <text x="58" y="364" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700">27 ms</text>
    <text x="58" y="376" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">OpenCode Go</text>
    <rect x="58" y="382" width="120" height="13" rx="6.5" fill="#fb7185" fill-opacity=".85"/>
    <text x="58" y="410" fill="#fb7185" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700">297 ms</text>
    <text x="58" y="434" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">OpenCode Go is</text>
    <text x="58" y="456" fill="#fb7185" font-family="system-ui,sans-serif" font-size="17" font-weight="700">11 times slower</text>
    <rect x="300" y="260" width="240" height="206" rx="14" fill="#0f172a" fill-opacity=".7" stroke="#1e293b"/>
    <text x="318" y="288" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Delay to the first token</text>
    <text x="318" y="306" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">a short answer</text>
    <text x="318" y="330" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Command Code</text>
    <rect x="318" y="336" width="50" height="13" rx="6.5" fill="#34d399" fill-opacity=".85"/>
    <text x="318" y="364" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700">754 ms</text>
    <text x="318" y="376" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">OpenCode Go</text>
    <rect x="318" y="382" width="120" height="13" rx="6.5" fill="#fb7185" fill-opacity=".85"/>
    <text x="318" y="410" fill="#fb7185" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700">1822 ms</text>
    <text x="318" y="434" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">OpenCode Go is</text>
    <text x="318" y="456" fill="#fb7185" font-family="system-ui,sans-serif" font-size="17" font-weight="700">2.4 times slower</text>
    <rect x="560" y="260" width="240" height="206" rx="14" fill="#0f172a" fill-opacity=".7" stroke="#1e293b"/>
    <text x="578" y="288" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Speed of the writing</text>
    <text x="578" y="306" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">visible content, long answer</text>
    <text x="578" y="330" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Command Code</text>
    <rect x="578" y="336" width="120" height="13" rx="6.5" fill="#34d399" fill-opacity=".85"/>
    <text x="578" y="364" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700">446 tok/s</text>
    <text x="578" y="376" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">OpenCode Go</text>
    <rect x="578" y="382" width="79" height="13" rx="6.5" fill="#fb7185" fill-opacity=".85"/>
    <text x="578" y="410" fill="#fb7185" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700">292 tok/s</text>
    <text x="578" y="434" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">OpenCode Go is</text>
    <text x="578" y="456" fill="#fb7185" font-family="system-ui,sans-serif" font-size="17" font-weight="700">1.5 times slower</text>
    <rect x="820" y="260" width="240" height="206" rx="14" fill="#0f172a" fill-opacity=".7" stroke="#1e293b"/>
    <text x="838" y="288" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="13" font-weight="700">Four requests at once</text>
    <text x="838" y="306" fill="#64748b" font-family="system-ui,sans-serif" font-size="10.5">aggregate of four parallel</text>
    <text x="838" y="330" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">Command Code</text>
    <rect x="838" y="336" width="120" height="13" rx="6.5" fill="#34d399" fill-opacity=".85"/>
    <text x="838" y="364" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700">902 tok/s</text>
    <text x="838" y="376" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="10.5">OpenCode Go</text>
    <rect x="838" y="382" width="56" height="13" rx="6.5" fill="#fb7185" fill-opacity=".85"/>
    <text x="838" y="410" fill="#fb7185" font-family="ui-monospace,Menlo,monospace" font-size="11.5" font-weight="700">424 tok/s</text>
    <text x="838" y="434" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="11">OpenCode Go is</text>
    <text x="838" y="456" fill="#fb7185" font-family="system-ui,sans-serif" font-size="17" font-weight="700">2.1 times slower</text>
    <rect x="40" y="482" width="1020" height="92" rx="14" fill="url(#verdict)" stroke="#34d399" stroke-opacity=".5"/>
    <text x="64" y="516" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="19" font-weight="700">Command Code was faster on every measurement, in all four campaigns</text>
    <text x="64" y="540" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">The delays move between windows: the wait for the first byte ran 9 to 21 times. The rates do not.</text>
    <text x="64" y="560" fill="#cbd5e1" font-family="system-ui,sans-serif" font-size="12.5">The writing speed stayed between 1.5 and 1.7 times slower on OpenCode Go, window after window.</text>
    <rect x="40" y="588" width="1020" height="46" rx="12" fill="#0b1220" stroke="#1e293b"/>
    <text x="64" y="617" fill="#e2e8f0" font-family="ui-monospace,Menlo,monospace" font-size="12">Run it on your own machine, then publish your numbers: python bench.py ab --a commandcode --b opencode-go --n 4</text>
  </svg>

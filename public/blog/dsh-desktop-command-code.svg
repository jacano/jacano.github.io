  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
    <title id="title">One key, two files, one route</title>
    <desc id="desc">The desktop app reads two files in its home folder. It reads cordis.patch.yml once at boot: that file holds the Command Code route, the six models and the default model. It reads .credentials.yaml on every request: that file holds COMMANDCODE_API_KEY. Both feed one HTTPS route to api.commandcode.ai/provider/v1. An environment variable named COMMANDCODE_API_KEY outranks the file, so the store is never read.</desc>
    <defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#1e293b" stroke-width=".7"/></pattern></defs>
    <rect width="1100" height="560" fill="#020617"/>
    <rect width="1100" height="560" fill="url(#grid)"/>
    <text x="40" y="50" fill="#f8fafc" font-family="system-ui,sans-serif" font-size="25" font-weight="700">One key, two files, one route</text>
    <text x="40" y="78" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">what the desktop app reads in ~/.dsh, and what outranks what</text>

    <rect x="40" y="120" width="250" height="150" rx="14" fill="#0f172a" fill-opacity=".75" stroke="#38bdf8" stroke-opacity=".45"/>
    <text x="64" y="156" fill="#38bdf8" font-family="system-ui,sans-serif" font-size="19" font-weight="700">Desktop app</text>
    <text x="64" y="184" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">its own runtime</text>
    <text x="64" y="208" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="13">no Node, no terminal</text>
    <text x="64" y="240" fill="#64748b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">SETTINGS &#8594; MODELS</text>
    <text x="64" y="258" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">takes the key once</text>

    <rect x="390" y="104" width="380" height="86" rx="14" fill="#0f172a" fill-opacity=".75" stroke="#a78bfa" stroke-opacity=".45"/>
    <text x="414" y="136" fill="#a78bfa" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700">cordis.patch.yml</text>
    <text x="414" y="160" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">the route, six models, the default</text>
    <text x="414" y="180" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">read at boot</text>

    <rect x="390" y="208" width="380" height="86" rx="14" fill="#0f172a" fill-opacity=".75" stroke="#34d399" stroke-opacity=".45"/>
    <text x="414" y="240" fill="#34d399" font-family="ui-monospace,Menlo,monospace" font-size="14" font-weight="700">.credentials.yaml</text>
    <text x="414" y="264" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">COMMANDCODE_API_KEY</text>
    <text x="414" y="284" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">read per request, watched on disk</text>

    <rect x="850" y="146" width="210" height="106" rx="14" fill="#0f172a" fill-opacity=".75" stroke="#fbbf24" stroke-opacity=".45"/>
    <text x="874" y="182" fill="#fbbf24" font-family="system-ui,sans-serif" font-size="17" font-weight="700">Command Code</text>
    <text x="874" y="208" fill="#e2e8f0" font-family="ui-monospace,Menlo,monospace" font-size="11.5">api.commandcode.ai</text>
    <text x="874" y="226" fill="#e2e8f0" font-family="ui-monospace,Menlo,monospace" font-size="11.5">/provider/v1</text>
    <text x="874" y="246" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">openai-completions</text>

    <path d="M290 168 H390" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
    <path d="M382 163 L390 168 L382 173" fill="none" stroke="#a78bfa" stroke-width="1.6"/>
    <path d="M290 228 H390" fill="none" stroke="#34d399" stroke-width="1.6"/>
    <path d="M382 223 L390 228 L382 233" fill="none" stroke="#34d399" stroke-width="1.6"/>
    <path d="M770 199 H850" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
    <path d="M842 194 L850 199 L842 204" fill="none" stroke="#fbbf24" stroke-width="1.6"/>
    <text x="778" y="188" fill="#64748b" font-family="system-ui,sans-serif" font-size="11" font-weight="700">HTTPS</text>

    <rect x="40" y="330" width="1020" height="96" rx="14" fill="#0f172a" fill-opacity=".85" stroke="#fb7185" stroke-opacity=".45"/>
    <text x="64" y="362" fill="#fb7185" font-family="system-ui,sans-serif" font-size="17" font-weight="700">An environment variable of the same name outranks the file</text>
    <text x="64" y="388" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">The order is: inherited environment, then .credentials.yaml, then a project .env, then ~/.dsh/.env.</text>
    <text x="64" y="410" fill="#e2e8f0" font-family="system-ui,sans-serif" font-size="13">So if COMMANDCODE_API_KEY is exported, the store is never read and the Models page cannot fix the key.</text>

    <text x="40" y="468" fill="#94a3b8" font-family="system-ui,sans-serif" font-size="12">The same two files drive the web and headless profiles: one configuration, three front ends.</text>
    <text x="40" y="494" fill="#64748b" font-family="ui-monospace,Menlo,monospace" font-size="11.5">~/.dsh/cordis.patch.yml &#183; ~/.dsh/.credentials.yaml</text>
    <text x="40" y="530" fill="#475569" font-family="system-ui,sans-serif" font-size="12">DeepSeek Harness 0.2.0-rc.2, Command Code openai-completions, October 2026.</text>
  </svg>
